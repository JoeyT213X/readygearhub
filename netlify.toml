# Same-origin proxy for the official NHC CurrentStorms.json feed (no CORS on nhc.noaa.gov).
[[redirects]]
  from = "/feeds/nhc-current-storms.json"
  to = "https://www.nhc.noaa.gov/CurrentStorms.json"
  status = 200
  force = true

