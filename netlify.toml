[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Paid template/PDF shop taken down. Keep these 301s so old links still land somewhere useful.
[[redirects]]
  from = "/shop/winter-storm-prep-planner"
  to = "/winter-storm-ready-checklist/"
  status = 301

[[redirects]]
  from = "/shop/winter-storm-prep-planner/"
  to = "/winter-storm-ready-checklist/"
  status = 301

[[redirects]]
  from = "/shop/family-emergency-binder"
  to = "/apps/all-accounted/"
  status = 301

[[redirects]]
  from = "/shop/family-emergency-binder/"
  to = "/apps/all-accounted/"
  status = 301

[[redirects]]
  from = "/shop/*"
  to = "/guides/"
  status = 301

[[redirects]]
  from = "/directory/downloads"
  to = "/guides/"
  status = 301

[[redirects]]
  from = "/directory/downloads/"
  to = "/guides/"
  status = 301

[[redirects]]
  from = "/directory/downloads/*"
  to = "/guides/"
  status = 301

# Same-origin proxy for the official NHC CurrentStorms.json feed (no CORS on nhc.noaa.gov).
[[redirects]]
  from = "/feeds/nhc-current-storms.json"
  to = "https://www.nhc.noaa.gov/CurrentStorms.json"
  status = 200
  force = true

# Shorts traffic: /go/<slug> short links to each Short's landing page with UTMs (302, so a destination can be swapped later).

[[redirects]]
  from = "/go/big-berkey-gravity-filter"
  to = "/directory/water/?utm_source=youtube&utm_medium=shorts&utm_campaign=big-berkey-gravity-filter"
